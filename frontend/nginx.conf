# intake-demo web tier: serves the Vue SPA and reverse-proxies /api to the
# FastAPI backend over the compose network (same-origin → cookie auth + no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → FastAPI backend (service name "api" on the compose network)
    location /api/ {
        proxy_pass http://api:8910;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # preserve the original scheme from the upstream edge proxy so the app knows
        # the request was HTTPS (secure-cookie handling)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
