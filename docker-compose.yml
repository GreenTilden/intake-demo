services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: intake
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake-dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Schema + synthetic seed run in filename order on FIRST init of an empty
      # data volume: 001_initial_schema.sql then 002_synthetic_seed.sql.
      # To re-seed from scratch: `docker compose down -v && docker compose up -d`.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "${PORT:-8910}:8910"
    environment:
      DATABASE_URL: postgresql+asyncpg://intake:${POSTGRES_PASSWORD:-intake-dev}@postgres:5432/intake
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@intake-demo.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5012}
      UPLOAD_DIR: /opt/intake/uploads
    volumes:
      - uploads:/opt/intake/uploads
    depends_on:
      - postgres
    restart: unless-stopped

  # Production frontend (uncomment when frontend is built)
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api
  #   restart: unless-stopped

volumes:
  pg-data:
  uploads:
